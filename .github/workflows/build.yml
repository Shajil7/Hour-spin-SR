name: Build Hourly Spin Kings APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q HourlySpinKings-GitHub-Chrome.zip -d project

          if [ -d "project/HourlySpinKings" ]; then
            shopt -s dotglob
            mv project/HourlySpinKings/* project/
            rmdir project/HourlySpinKings
          fi

          chmod +x project/gradlew

      - name: Build APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HourlySpinKings-APK
          path: project/app/build/outputs/apk/debug/*.apk
